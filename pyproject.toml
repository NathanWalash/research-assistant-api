[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant-api"
version = "0.1.0"
description = "FastAPI service for research discovery and organisation workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pgvector>=0.3,<1.0",
    "PyJWT>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0.36,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
research-assistant-ingest = "research_assistant_api.ingestion.cli:main"
research-assistant-embed = "research_assistant_api.embeddings.cli:main"
research-assistant-export-citation-graph = "research_assistant_api.citation_graph.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "openalexnet>=0.1.2,<0.2",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
    "sentence-transformers>=3.4,<4.0",
]
semantic = [
    "sentence-transformers>=3.4,<4.0",
]
graph = [
    "openalexnet>=0.1.2,<0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
