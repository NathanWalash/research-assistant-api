name: CI

on:
  push:
  pull_request:

jobs:
  api-contract:
    name: API contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify OpenAPI endpoint contract
        run: python -m pytest tests/test_api_coverage_api.py

  mcp-contract:
    name: MCP contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify MCP tools and mount behavior
        run: python -m pytest tests/test_mcp_server.py tests/test_mcp_public_tools.py tests/test_mcp_http_mount.py

  test:
    name: Run Python smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api-contract, mcp-contract]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run pytest
        run: python -m pytest

  postgres-migration:
    name: Verify PostgreSQL migration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: research_assistant
          POSTGRES_USER: research_user
          POSTGRES_PASSWORD: research_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_user -d research_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RESEARCH_API_DATABASE_URL: postgresql+psycopg://research_user:research_password@localhost:5432/research_assistant
      RESEARCH_API_RUN_POSTGRES_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Verify schema tables
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from research_assistant_api.db.session import get_engine, reset_database_state

          reset_database_state()
          tables = set(inspect(get_engine()).get_table_names())
          expected = {
              "alembic_version",
              "annotations",
              "authors",
              "citations",
              "institutions",
              "paper_authors",
              "papers",
              "projects",
              "reading_list_items",
              "topics",
              "users",
          }
          missing = expected - tables
          if missing:
              raise SystemExit(f"Missing tables: {sorted(missing)}")
          print("PostgreSQL schema verified")
          PY

      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/test_postgres_integration.py

  docker-smoke:
    name: Verify Docker app startup
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start API stack
        run: docker compose --profile app up -d --build

      - name: Wait for API health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose --profile app logs api --tail 200
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile app logs api --tail 200

      - name: Stop API stack
        if: always()
        run: docker compose --profile app down -v
